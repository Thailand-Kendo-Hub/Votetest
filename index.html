<title>TKA Vote — prototype v2</title>

<!--
  TKA VOTING PAGE — PROTOTYPE v2
  ==============================
  DESIGN PREVIEW ONLY. Nothing is live. No database exists.
  All content is sample text written into this file.

  The dark bar at the top is a TESTING CONTROL that will not exist on
  the real page. There, the page works out the phase from the dates.

  Written to be readable by a non-developer. Sections are commented.
  To change any wording, edit the UI block in the script.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* 1. COLOURS — same set as the Decisions Record */
:root{
  --ink:#0E1419; --ink2:#3C4650; --muted:#6F7880;
  --bg:#FFFFFF; --bg2:#F5F7F9; --line:#E3E8EC;
  --navy:#0B3D5C; --navy2:#0F5680; --navy3:#E8F0F6;
  --green:#157A48; --greenbg:#E6F4EC;
  --amber:#9A6A00; --amberbg:#FBF1D6;
  --red:#B4311F;   --redbg:#FBE7E3;
  --grey:#6F7880;  --greybg:#EEF1F3;
  --r:10px;
}

/* 2. TYPE — same three Noto families as the Decisions Record */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg2);color:var(--ink);
  font-family:"Noto Sans","Noto Sans Thai","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
body[data-lang="th"]{line-height:1.82}
body[data-lang="jp"]{line-height:1.8}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em;line-height:1.32}
p{margin:0 0 .7em} p:last-child{margin-bottom:0}
a{color:var(--navy2)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}

/* 3. TESTING CONTROL — not on the real page */
.preview{background:#2A2F35;color:#fff;font-size:13px;padding:9px 16px;
  display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.preview span{opacity:.7}
.preview select{font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;
  border:1px solid #555;background:#3A4048;color:#fff}
.preview label{display:flex;align-items:center;gap:5px;opacity:.85}

/* 4. TOP BAR */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{font:inherit;font-size:12.5px;padding:6px 10px;border:0;background:#fff;color:var(--muted);cursor:pointer;line-height:1.4}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--navy2);color:#fff}

/* 5. HERO — where we are in the month */
.phase{background:var(--navy);color:#fff;border-radius:0 0 14px 14px;padding:20px 18px 16px;margin:0 -16px 14px}
.phase .round{font-size:12.5px;opacity:.7;margin-bottom:3px}
.phase h1{font-size:23px;color:#fff;margin-bottom:5px}
.phase .sub{font-size:14px;opacity:.86}
.rail{display:flex;margin-top:16px;gap:5px}
.rail div{flex:1;min-width:0;border-top:3px solid rgba(255,255,255,.2);padding-top:7px;
  font-size:12px;line-height:1.36;color:rgba(255,255,255,.52)}
.rail div .wk{display:block;font-size:10.5px;opacity:.7}
.rail div .dt{display:block;font-size:11px;opacity:.7;margin-top:1px}
.rail div.done{border-top-color:rgba(255,255,255,.46);color:rgba(255,255,255,.68)}
.rail div.now{border-top-color:#fff;color:#fff;font-weight:600}
.clock{margin-top:14px;background:rgba(255,255,255,.1);border-radius:8px;padding:9px 12px;
  font-size:13.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock b{font-weight:600;font-variant-numeric:tabular-nums}

/* 6. PROGRESS + STANDING NOTE */
.prog{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}
.prog .big{font-weight:600}
.prog .rest{color:var(--muted);font-size:13px}
.meter{height:6px;background:var(--greybg);border-radius:4px;margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy2)}
.notbinding{border-left:3px solid var(--amber);background:var(--amberbg);color:#5E4200;
  border-radius:0 var(--r) var(--r) 0;padding:11px 13px;font-size:13.5px;margin-bottom:14px}

/* 7. CARDS */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ihead{padding:14px 16px 0}
.inum{font-size:12px;color:var(--navy2);font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.tick{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--green);color:#fff;
  font-size:10px;align-items:center;justify-content:center;font-weight:700}
.istate{float:right;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:500;line-height:1.6}
.st-discussion{background:var(--navy3);color:var(--navy2)}
.st-voting{background:var(--greenbg);color:var(--green)}
.st-closed{background:var(--greybg);color:var(--grey)}
.st-extension{background:var(--amberbg);color:var(--amber)}
.st-ratified{background:var(--navy);color:#fff}
.ititle{font-size:17px;margin:8px 0 9px;line-height:1.42}
.ibody{padding:0 16px 15px;color:var(--ink2);font-size:15px}
.attach{padding:0 16px 15px;margin-top:-8px;font-size:13.5px}
.zone{border-top:1px solid var(--line);padding:14px 16px;background:var(--bg2)}
.zlabel{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.sub2{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}

/* 8. CONTROLS */
.votes{display:grid;gap:8px}
.vb{font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:9px;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:10px;width:100%}
.vb .dot{width:17px;height:17px;border-radius:50%;flex:none;border:1.5px solid #C6CDD3;background:#fff}
.vb[aria-pressed="true"]{border-color:var(--navy2);background:var(--navy3)}
.vb[aria-pressed="true"] .dot{border-color:var(--navy2);background:var(--navy2);box-shadow:inset 0 0 0 3px #fff}
.vb:focus-visible,.act:focus-visible,.linkbtn:focus-visible,summary:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=url],textarea,select.pick{width:100%;font:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);margin-top:8px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select.pick:focus{outline:2px solid var(--navy2);outline-offset:-1px;border-color:var(--navy2)}
.fl{font-size:13px;color:var(--ink2);margin-top:12px}
.fl:first-child{margin-top:0}
.act{font:inherit;font-size:15px;font-weight:600;width:100%;padding:13px;border-radius:9px;border:0;
  margin-top:12px;background:var(--navy2);color:#fff;cursor:pointer}
.act:disabled{background:#C6CDD3;cursor:default}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;padding:10px 0;min-height:44px;
  color:var(--navy2);cursor:pointer;text-decoration:underline;display:inline-flex;align-items:center}
.del{color:var(--red)}
.turnout{font-size:13px;color:var(--ink2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}
.exthelp{font-size:12.5px;color:var(--muted);margin-top:2px}

/* 9. COLLAPSIBLE SECTIONS — comments and full results */
details{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
details.first{border-top:0;margin-top:0;padding-top:0}
summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--ink);
  padding:9px 0;display:flex;align-items:center;gap:8px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
  transform:rotate(45deg);margin-left:auto;margin-right:4px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.cmt{padding:11px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0;padding-top:2px}
.cmt .by{font-size:13px;font-weight:600;margin-bottom:1px}
.cmt .when{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}
.cmt .txt{font-size:14.5px;color:var(--ink2)}
.nocmt{font-size:13.5px;color:var(--muted);padding:4px 0 8px}

/* 10. RESULTS */
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--greybg);margin:2px 0 7px}
.bar i{display:block}
.counts{font-size:13px;color:var(--ink2);margin-bottom:7px}
.counts b{font-weight:600}
.thresh{font-size:13px}
.ok{color:var(--green);font-weight:600} .no{color:var(--red);font-weight:600}
.tally{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
.tally td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.tally tr:first-child td{border-top:0}
.tally .nm{font-weight:500;width:40%}
.tally .pos{text-align:right;white-space:nowrap}
.pa{color:var(--green)} .pd{color:var(--red)} .px{color:var(--muted)}
.cond{font-size:13.5px;color:var(--ink2);padding-top:2px}
.flag{background:var(--amberbg);border-left:3px solid var(--amber);color:#5E4200;
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;font-size:14px;margin-bottom:12px}
.pending{background:var(--navy3);border-left:3px solid var(--navy2);color:var(--navy);
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;font-size:14px;margin-bottom:12px}
.res{background:var(--navy3);border-radius:var(--r);padding:13px 14px;font-size:15px;margin-bottom:13px}
.res .rl{font-size:12.5px;color:var(--navy2);font-weight:600;margin-bottom:4px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.mini .ml{font-size:12px;color:var(--muted);margin-bottom:4px}
.mini .mv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* 11. MEETING CARD + AGENDA INDEX */
.mhead{padding:14px 16px 12px}
.mhead h2{font-size:17px}
.mhead .meta{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.6}
.att{padding:0 16px 14px}
.attsum{font-size:13.5px;line-height:1.7}
.attsum b{font-weight:600}
.agenda{padding:2px 16px 8px}
.ag{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;text-decoration:none;color:var(--ink);min-height:44px}
.ag .agn{font-size:12px;color:var(--navy2);font-weight:600;display:block}
.ag.ext .agn::after{content:" · ";color:var(--muted)}
.help{font-size:13px;color:var(--muted);text-align:center;padding:20px 6px 0;line-height:1.6}
.help b{color:var(--ink2);font-weight:500}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:12px 6px 0;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------------- hero ---------------- */
function drawPhase(){
  document.getElementById("who").innerHTML = esc(t("votingAs"))+" <b>"+esc(ME)+"</b>";
  document.getElementById("roundLine").textContent = t("round");
  document.getElementById("help").innerHTML = t("help");
  document.getElementById("foot").textContent = t("foot");

  var map = {w1:["t1","s1",0],w2:["t2","s2",1],w3:["t3","s3",2],result:["t4","s4",3],ratified:["t6","s6",3]};
  var m = map[phase];
  document.getElementById("phaseTitle").textContent = t(m[0]);
  document.getElementById("phaseSub").textContent = t(m[1]);

  var st=[["w1","w1n","w1d"],["w2","w2n","w2d"],["w3","w3n","w3d"],["w4","w4n","w4d"]], h="";
  for(var i=0;i<4;i++){
    var cls = i<m[2] ? "done" : (i===m[2] ? "now" : "");
    h += '<div class="'+cls+'"><span class="wk">'+esc(t(st[i][0]))+'</span>'+esc(t(st[i][1]))+
         '<span class="dt">'+esc(t(st[i][2]))+'</span></div>';
  }
  document.getElementById("rail").innerHTML = h;

  var c = document.getElementById("clock");
  c.hidden = (phase !== "w3");
  if(phase === "w3"){ document.getElementById("clockLabel").textContent = t("closes"); tick(); }

  var nb = document.getElementById("notBinding");
  nb.hidden = (phase === "w1" || phase === "w2");
  nb.textContent = t("notBinding");

  document.getElementById("entLabel").hidden = (phase !== "ratified");
}
function tick(){
  if(phase !== "w3") return;
  var ms = DEADLINE - new Date();
  if(ms < 0){ document.getElementById("clockVal").textContent = t("closed"); return; }
  var d=Math.floor(ms/86400000), h=Math.floor(ms/3600000)%24, m=Math.floor(ms/60000)%60;
  document.getElementById("clockVal").textContent = d+"d "+h+"h "+m+"m";
}
setInterval(tick, 30000);

  var w = document.getElementById("progWrap"), n = ITEMS.length;
  if(phase === "w3"){
    var done = 0; for(var k in myVotes) done++;
    var line = done === n ? '<span class="big">'+esc(t("progDone"))+'</span>'
      : '<span class="big">'+esc(f("progVote",{a:done,b:n}))+'</span> <span class="rest">'+esc(f("progLeft",{n:n-done}))+'</span>';
    w.innerHTML = '<div class="prog">'+line+'<div class="meter"><i style="width:'+(done/n*100)+'%"></i></div></div>';
  } else if(phase === "w1" || phase === "w2"){
    w.innerHTML = '<div class="prog"><span class="rest">'+esc(f("progItems",{b:n}))+'</span></div>';
  } else w.innerHTML = "";
}

      h += '<button class="linkbtn del">'+esc(t("delete"))+'</button>';
    }
    h += '<div class="exthelp">'+esc(t("delNote"))+'</div></div>';
  }
  h += '</div>';
  h += '<div class="zlabel" style="padding:4px 2px 8px">'+esc(t("allProps"))+'</div>';
  w.innerHTML = h;
}

/* ---------------- meeting card (result + ratified) ---------------- */
function attLine(map, key){
  var names = [];
  for(var d in map){ var v = map[d]; if(key==="proxy" ? (v && v.proxy) : v===key) names.push(key==="proxy" ? d+" → "+v.proxy : d); }
  return names;
}
function drawMeeting(){
  var w = document.getElementById("meetingWrap");
  if(phase !== "result" && phase !== "ratified"){ w.innerHTML = ""; return; }
  var final = (phase === "ratified"), entered = resultEntered();
  var map = final ? ATTENDED : ATTEND;
  if(!final && myAttend) map = Object.assign({}, map, {Prem: myAttend==="proxy" ? {proxy:myProxy||"?"} : myAttend});

  var h = '<div class="card"><div class="mhead">';
  if(final && !entered) h += '<div class="pending">'+esc(t("recording"))+'</div>';
  h += '<h2>'+esc(t("meetingH"))+'</h2><div class="meta">'+esc(t("meetingWhen"))+'<br>'+esc(t("place"))+'</div></div>';

  if(!final){
    /* my reply */
    var present = DIRECTORS.filter(function(d){ return d!==ME && (ATTEND[d]==="inperson"||ATTEND[d]==="online"); });
    var opts=[["inperson",t("inPerson")],["online",t("online")],["proxy",t("proxy")],["cannot",t("cannot")]];
    h += '<div class="att"><div class="zlabel">'+esc(t("attendQ"))+'</div><div class="grid2">';
    for(var i=0;i<opts.length;i++)
      h += '<button class="vb" aria-pressed="'+(myAttend===opts[i][0]?"true":"false")+'" data-att="'+opts[i][0]+'"><span class="dot"></span>'+esc(opts[i][1])+'</button>';
    h += '</div>';
    if(myAttend === "proxy"){
      h += '<div class="fl">'+esc(t("proxyPick"))+'</div><select class="pick" id="proxyPick"><option value=""></option>';
      for(var j=0;j<present.length;j++) h += '<option'+(myProxy===present[j]?" selected":"")+'>'+esc(present[j])+'</option>';
      h += '</select>';
    }
    h += '</div>';
  }

  /* summary of everyone */
  var noreply = DIRECTORS.filter(function(d){ return !map[d]; });
  h += '<div class="att"><div class="zlabel">'+esc(final?t("attended"):t("attendSum"))+'</div><div class="attsum">';
  h += '<b>'+esc(t("inPerson"))+'</b> ('+attLine(map,"inperson").length+'): '+esc(attLine(map,"inperson").join(", "))+'<br>';
  h += '<b>'+esc(t("online"))+'</b> ('+attLine(map,"online").length+'): '+esc(attLine(map,"online").join(", "))+'<br>';
  h += '<b>'+esc(t("proxyTo"))+'</b> ('+attLine(map,"proxy").length+'): '+esc(attLine(map,"proxy").join(", "))+'<br>';
  h += '<b>'+esc(t("cannot"))+'</b> ('+attLine(map,"cannot").length+'): '+esc(attLine(map,"cannot").join(", "));
  if(!final) h += '<br><b>'+esc(t("noReply"))+'</b> ('+noreply.length+'): '+esc(noreply.join(", "));
  h += '</div></div>';

  if(final){
    h += '<div class="att"><div class="zlabel">'+esc(t("minutes"))+'</div>';
    h += entered ? '<a href="#">'+esc(t("minutesLink"))+'</a>' : '<span style="color:var(--muted);font-size:13.5px">—</span>';
    h += '</div>';
  } else {
    /* agenda as index */
    h += '<div class="agenda"><div class="zlabel">'+esc(t("agendaH"))+'</div>';
    for(var k=0;k<ITEMS.length;k++){
      var it = ITEMS[k];
      h += '<a class="ag" href="#'+esc(it.num)+'"><span class="agn">'+esc(it.num)+(it.ext>=3?' · '+esc(t("reqExt")):'')+'</span>'+esc(it.title[lang])+'</a>';
    }
    h += '</div>';
  }
  w.innerHTML = h + '</div>';
}

/* ---------------- items ---------------- */
function drawItems(){
  var out=""; for(var i=0;i<ITEMS.length;i++) out += itemHtml(ITEMS[i], i);
  document.getElementById("items").innerHTML = out;
}
function stateLabel(it){
  if(phase==="w1"||phase==="w2") return [t("w2n"),"st-discussion"];
  if(phase==="w3") return [t("w3n"),"st-voting"];
  if(phase==="result") return it.ext>=3 ? [t("reqExt"),"st-extension"] : [t("agendaState"),"st-closed"];
  return [t("resolution"),"st-ratified"];
}
function itemHtml(it, idx){
  var s = stateLabel(it);
  var h = '<div class="card" id="'+esc(it.num)+'"><div class="ihead">';
  if(phase!=="w1") h += '<span class="istate '+s[1]+'">'+esc(s[0])+'</span>';
  h += '<div class="inum">'+esc(it.num)+(phase==="w3"&&myVotes[idx]?'<span class="tick" aria-label="voted">✓</span>':'')+'</div>';
  h += '<h2 class="ititle">'+esc(it.title[lang])+'</h2></div>';
  h += '<div class="ibody">'+esc(it.body[lang])+'</div>';
  if(it.link) h += '<div class="attach">'+esc(t("attachment"))+': <a href="#">'+esc(it.link)+'</a></div>';
  if(phase==="w2")            h += zoneDiscussion(it);
  else if(phase==="w3")       h += zoneVoting(it, idx);
  else if(phase==="result")   h += zoneResult(it);
  else if(phase==="ratified") h += zoneRatified(it);
  return h + '</div>';
}
function commentsBlock(it, open, first){
  var h = '<details'+(open?" open":"")+(first?' class="first"':'')+'><summary>'+esc(t("comments"))+' ('+it.comments.length+')</summary>';
  h += it.comments.length ? threadHtml(it) : '<div class="nocmt">'+esc(t("noCmt"))+'</div>';
  return h + '</details>';
}
function zoneDiscussion(it){
  var h = '<div class="zone">'+commentsBlock(it, true, true);
  h += '<div class="fl">'+esc(t("addComment"))+'</div><textarea placeholder="'+esc(t("cmtPh"))+'"></textarea>';
  h += '<button class="act">'+esc(t("post"))+'</button></div>';
  return h;
}
function zoneVoting(it, idx){
  var opts=[["agree",t("agree")],["disagree",t("disagree")],["abstain",t("abstain")]], mine=myVotes[idx]||null;
  var h = '<div class="zone"><div class="zlabel">'+esc(t("yourVote"))+'</div><div class="votes">';
  for(var i=0;i<opts.length;i++)
    h += '<button class="vb" aria-pressed="'+(mine===opts[i][0]?"true":"false")+'" data-vote="'+opts[i][0]+'" data-idx="'+idx+'"><span class="dot"></span>'+esc(opts[i][1])+'</button>';
  h += '</div><div class="fl">'+esc(t("conditions"))+'</div><textarea placeholder="'+esc(t("condPh"))+'"></textarea>';
  h += '<button class="act"'+(mine?"":" disabled")+'>'+esc(mine?t("saved"):t("save"))+'</button>';
  h += '<div class="turnout"><button class="linkbtn" data-ext="'+idx+'">'+esc(t("reqExt"))+'</button>';
  h += '<div class="exthelp">'+esc(t("extHelp"))+'</div>';
  if(extAsked[idx]) h += '<div class="exthelp">'+esc(f("extAsked",{n:1}))+'</div>';
  h += '</div>';
  h += '<div class="turnout">'+esc(f("turnout",{a:it.voted.length}))+': '+esc(it.voted.join(", "))+'</div>';
  h += commentsBlock(it, false, false);
  return h + '</div>';
}
function zoneResult(it){
  var h = '<div class="zone">';
  if(it.ext >= 3) h += '<div class="flag">'+esc(t("extFlag"))+'</div>';
  h += '<div class="zlabel">'+esc(t("result"))+'</div>'+summaryHtml(it)+fullTallyHtml(it)+commentsBlock(it,false,false)+'</div>';
  return h;
}
function zoneRatified(it){
  var c = count(it);
  var h = '<div class="zone"><div class="res"><div class="rl">'+esc(t("resolution"))+'</div>'+esc(it.resolution[lang])+'</div>';
  h += '<div class="twocol"><div class="mini"><div class="ml">'+esc(t("onlineVote"))+'</div><div class="mv">'+c.agree+' / 13</div></div>';
  h += '<div class="mini"><div class="ml">'+esc(t("meetingVote"))+'</div><div class="mv" style="font-size:13.5px">'+esc(it.meeting[lang])+'</div></div></div>';
  h += fullTallyHtml(it) + commentsBlock(it,false,false) + '</div>';
  return h;
}
function count(it){ var c={agree:0,disagree:0,abstain:0,no_vote:0}; for(var i=0;i<it.tally.length;i++) c[it.tally[i].v]++; return c; }
function summaryHtml(it){
  var c=count(it), n=it.tally.length, pc=function(x){return (x/n*100)+"%";}, hit=c.agree>=7;
  return '<div class="bar"><i style="background:var(--green);width:'+pc(c.agree)+'"></i>'+
    '<i style="background:var(--red);width:'+pc(c.disagree)+'"></i><i style="background:#C6CDD3;width:'+pc(c.abstain+c.no_vote)+'"></i></div>'+
    '<div class="counts"><b>'+c.agree+'</b> '+esc(t("agree"))+' · <b>'+c.disagree+'</b> '+esc(t("disagree"))+' · <b>'+(c.abstain+c.no_vote)+'</b> '+esc(t("abstainShort"))+'</div>'+
    '<div class="thresh">'+esc(t("threshold"))+' — <span class="'+(hit?"ok":"no")+'">'+esc(hit?t("reached"):t("notReached"))+'</span></div>';
}
function fullTallyHtml(it){
  var h = '<details><summary>'+esc(t("showVotes"))+'</summary><table class="tally">';
  for(var i=0;i<it.tally.length;i++){
    var r=it.tally[i], lbl, cls;
    if(r.v==="agree"){lbl=t("agree");cls="pa";} else if(r.v==="disagree"){lbl=t("disagree");cls="pd";}
    else if(r.v==="abstain"){lbl=t("abstainShort");cls="px";} else {lbl=t("noVote");cls="px";}
    h += '<tr><td class="nm">'+esc(r.n)+'</td><td class="pos '+cls+'">'+esc(lbl)+'</td></tr>';
    if(r.c) h += '<tr><td colspan="2" class="cond" style="border-top:0;padding-top:0">'+esc(r.c[lang])+'</td></tr>';
  }
  return h + '</table></details>';
}
function threadHtml(it){
  var h="";
  for(var i=0;i<it.comments.length;i++){ var c=it.comments[i];
    h += '<div class="cmt"><div class="by">'+esc(c.by)+'<span class="when">'+esc(c.when[lang])+'</span></div><div class="txt">'+esc(c.txt[lang])+'</div></div>'; }
  return h;
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("button") : null;
  if(!b) return;
  if(b.dataset.lang){ setLang(b.dataset.lang); }
  if(b.dataset.vote){ myVotes[b.dataset.idx] = b.dataset.vote; render(); }
  if(b.dataset.ext){ extAsked[b.dataset.ext] = true; render(); }
  if(b.dataset.att){ myAttend = b.dataset.att; if(myAttend!=="proxy") myProxy=""; render(); }
});
document.addEventListener("change", function(e){
  if(e.target.id === "proxyPick"){ myProxy = e.target.value; render(); }
  if(e.target.id === "entered") render();
});
document.getElementById("phasePick").addEventListener("change", function(e){ phase = e.target.value; render(); });

function setLang(l){
  lang = l; try{ localStorage.setItem("tka-lang", l); }catch(e){}
  document.body.setAttribute("data-lang", lang);
  document.documentElement.lang = (lang==="jp"?"ja":lang);
  var bs=document.querySelectorAll(".lang button");
  for(var i=0;i<bs.length;i++) bs[i].setAttribute("aria-pressed", bs[i].dataset.lang===lang?"true":"false");
  render();
}
function render(){ drawPhase(); drawProgress(); drawMeeting(); drawSubmit(); drawItems(); }
setLang(lang);
</script>
</body>
</html>
