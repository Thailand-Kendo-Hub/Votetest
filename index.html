<html lang="en">
<head>
<meta charset="utf-8">

<title>TKA Vote — prototype</title>

<!--
  TKA VOTING PAGE — PROTOTYPE
  ===========================
  DESIGN PREVIEW ONLY. Nothing here is live.
  No votes are sent anywhere. No database exists yet.
  Everything you see is sample text written into this file.

  The dark bar at the top is a TESTING CONTROL. It will not exist on
  the real page — there, the page works out the phase from the dates.

  Written to be readable by a non-developer. Sections are numbered
  and commented. To change wording, edit the UI block in the script.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------------------
   1. COLOURS — same set as the Decisions Record
   --------------------------------------------------------------- */
:root{
  --ink:#0E1419; --ink2:#3C4650; --muted:#6F7880;
  --bg:#FFFFFF; --bg2:#F5F7F9; --line:#E3E8EC;
  --navy:#0B3D5C; --navy2:#0F5680; --navy3:#E8F0F6;
  --green:#157A48; --greenbg:#E6F4EC;
  --amber:#9A6A00; --amberbg:#FBF1D6;
  --red:#B4311F;   --redbg:#FBE7E3;
  --grey:#6F7880;  --greybg:#EEF1F3;
  --r:10px;
}

/* ---------------------------------------------------------------
   2. TYPE — same three Noto families as the Decisions Record
   --------------------------------------------------------------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg2); color:var(--ink);
  font-family:"Noto Sans","Noto Sans Thai","Noto Sans JP",system-ui,sans-serif;
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
body[data-lang="th"]{line-height:1.82}
body[data-lang="jp"]{line-height:1.8}

h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em;line-height:1.32}
p{margin:0 0 .7em} p:last-child{margin-bottom:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}

/* ---------------------------------------------------------------
   3. TESTING CONTROL — will not exist on the real page
   --------------------------------------------------------------- */
.preview{background:#2A2F35;color:#fff;font-size:13px;padding:9px 16px;
  display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.preview span{opacity:.7}
.preview select{font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;
  border:1px solid #555;background:#3A4048;color:#fff}

/* ---------------------------------------------------------------
   4. TOP BAR
   --------------------------------------------------------------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;font-size:13px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{font:inherit;font-size:12.5px;padding:5px 9px;border:0;background:#fff;
  color:var(--muted);cursor:pointer;line-height:1.4}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--navy2);color:#fff}

/* ---------------------------------------------------------------
   5. HERO — where we are in the month
   --------------------------------------------------------------- */
.phase{background:var(--navy);color:#fff;border-radius:0 0 14px 14px;
  padding:20px 18px 16px;margin:0 -16px 14px}
.phase .round{font-size:12.5px;opacity:.7;margin-bottom:3px}
.phase h1{font-size:23px;color:#fff;margin-bottom:5px}
.phase .sub{font-size:14px;opacity:.86}
.rail{display:flex;margin-top:16px;gap:5px}
.rail div{flex:1;min-width:0;border-top:3px solid rgba(255,255,255,.2);
  padding-top:7px;font-size:11px;line-height:1.34;color:rgba(255,255,255,.52)}
.rail div .wk{display:block;font-size:10px;opacity:.7;margin-bottom:1px}
.rail div .dt{display:block;font-size:10px;opacity:.6;margin-top:1px}
.rail div.done{border-top-color:rgba(255,255,255,.46);color:rgba(255,255,255,.68)}
.rail div.now{border-top-color:#fff;color:#fff;font-weight:600}
.clock{margin-top:14px;background:rgba(255,255,255,.1);border-radius:8px;
  padding:9px 12px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px}
.clock b{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------
   6. PROGRESS + STANDING NOTES
   --------------------------------------------------------------- */
.prog{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:12px;font-size:14px}
.prog .big{font-weight:600}
.prog .rest{color:var(--muted);font-size:13px}
.meter{height:6px;background:var(--greybg);border-radius:4px;margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy2)}

.notbinding{border-left:3px solid var(--amber);background:var(--amberbg);color:#5E4200;
  border-radius:0 var(--r) var(--r) 0;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.draft{font-size:12.5px;color:var(--muted);margin-bottom:16px;padding-left:2px}

/* ---------------------------------------------------------------
   7. ITEM CARDS
   --------------------------------------------------------------- */
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:14px;overflow:hidden}
.ihead{padding:14px 16px 0}
.inum{font-size:12px;color:var(--navy2);font-weight:600;font-variant-numeric:tabular-nums}
.istate{float:right;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:500;line-height:1.6}
.st-discussion{background:var(--navy3);color:var(--navy2)}
.st-voting{background:var(--greenbg);color:var(--green)}
.st-closed{background:var(--greybg);color:var(--grey)}
.st-extension{background:var(--amberbg);color:var(--amber)}
.st-ratified{background:var(--navy);color:#fff}
.ititle{font-size:17px;margin:8px 0 9px;line-height:1.42}
.ibody{padding:0 16px 15px;color:var(--ink2);font-size:15px}
.attach{padding:0 16px 15px;margin-top:-8px;font-size:13.5px}
.attach a{color:var(--navy2)}

.zone{border-top:1px solid var(--line);padding:14px 16px;background:var(--bg2)}
.zlabel{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.sub2{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}

/* ---------------------------------------------------------------
   8. CONTROLS
   --------------------------------------------------------------- */
.votes{display:grid;gap:8px}
.vb{font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:9px;
  cursor:pointer;background:#fff;border:1.5px solid var(--line);color:var(--ink);
  display:flex;align-items:center;gap:10px;width:100%}
.vb .dot{width:17px;height:17px;border-radius:50%;flex:none;border:1.5px solid #C6CDD3;background:#fff}
.vb[aria-pressed="true"]{border-color:var(--navy2);background:var(--navy3)}
.vb[aria-pressed="true"] .dot{border-color:var(--navy2);background:var(--navy2);box-shadow:inset 0 0 0 3px #fff}
.vb:focus-visible,.act:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}

input[type=text],input[type=url],textarea{
  width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);margin-top:8px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px;border-color:var(--navy2)}
.fl{font-size:13px;color:var(--ink2);margin-top:12px}
.fl:first-child{margin-top:0}

.act{font:inherit;font-size:15px;font-weight:600;width:100%;padding:13px;border-radius:9px;
  border:0;margin-top:12px;background:var(--navy2);color:#fff;cursor:pointer}
.act:disabled{background:#C6CDD3;cursor:default}
.linkbtn{font:inherit;font-size:13.5px;background:none;border:0;padding:0;
  color:var(--navy2);cursor:pointer;text-decoration:underline}
.del{color:var(--red)}

.turnout{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.names{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.55}
.exthelp{font-size:12.5px;color:var(--muted);margin-top:5px}

/* ---------------------------------------------------------------
   9. DISCUSSION
   --------------------------------------------------------------- */
.cmt{padding:11px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0;padding-top:0}
.cmt .by{font-size:13px;font-weight:600;margin-bottom:1px}
.cmt .when{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}
.cmt .txt{font-size:14.5px;color:var(--ink2)}
.nocmt{font-size:13.5px;color:var(--muted)}

/* ---------------------------------------------------------------
   10. RESULTS
   --------------------------------------------------------------- */
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--greybg);margin:2px 0 11px}
.bar i{display:block}
.legend{display:flex;gap:14px;font-size:13px;margin-bottom:11px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.thresh{font-size:13px;margin-bottom:12px}
.thresh b{font-weight:600}
.ok{color:var(--green)} .no{color:var(--red)}

.tally{width:100%;border-collapse:collapse;font-size:14px}
.tally td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.tally tr:first-child td{border-top:0}
.tally .nm{font-weight:500;width:40%}
.tally .pos{text-align:right;white-space:nowrap}
.pa{color:var(--green)} .pd{color:var(--red)} .px{color:var(--muted)}
.cond{font-size:13.5px;color:var(--ink2);padding-top:2px}

.flag{background:var(--amberbg);border-left:3px solid var(--amber);color:#5E4200;
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;font-size:14px;margin-bottom:12px}
.pending{background:var(--navy3);border-left:3px solid var(--navy2);color:var(--navy);
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;font-size:14px}
.res{background:var(--navy3);border-radius:var(--r);padding:13px 14px;font-size:15px;margin-bottom:13px}
.res .rl{font-size:12.5px;color:var(--navy2);font-weight:600;margin-bottom:4px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.mini .ml{font-size:12px;color:var(--muted);margin-bottom:4px}
.mini .mv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------
   11. AGENDA
   --------------------------------------------------------------- */
.agenda{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:14px}
.agenda h2{font-size:17px;margin-bottom:3px}
.agenda .meta{font-size:12.5px;color:var(--muted);margin-bottom:11px}
.ag{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.ag .agn{font-size:12px;color:var(--navy2);font-weight:600}
.ag .agr{font-size:13px;color:var(--muted);margin-top:1px}

.help{font-size:13px;color:var(--muted);text-align:center;padding:20px 6px 0;line-height:1.6}
.help b{color:var(--ink2);font-weight:500}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:12px 6px 0;line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------------- hero ---------------- */
function drawPhase(){
  document.getElementById("who").innerHTML = esc(t("votingAs"))+" <b>"+esc(ME)+"</b>";
  document.getElementById("roundLine").textContent = t("round");
  document.getElementById("notBinding").textContent = t("notBinding");
  document.getElementById("draftNote").textContent = t("draft");
  document.getElementById("help").innerHTML = t("help");
  document.getElementById("foot").textContent = t("foot");

  var map = {w1:["t1","s1",0], w2:["t2","s2",1], w3:["t3","s3",2],
             result:["t4","s4",3], recording:["t5","s5",3], ratified:["t6","s6",3]};
  var m = map[phase];
  document.getElementById("phaseTitle").textContent = t(m[0]);
  document.getElementById("phaseSub").textContent = t(m[1]);

  var st=[["w1","w1n","w1d"],["w2","w2n","w2d"],["w3","w3n","w3d"],["w4","w4n","w4d"]], h="";
  for(var i=0;i<4;i++){
    var cls = i<m[2] ? "done" : (i===m[2] ? "now" : "");
    h += '<div class="'+cls+'"><span class="wk">'+esc(t(st[i][0]))+'</span>'+
         esc(t(st[i][1]))+'<span class="dt">'+esc(t(st[i][2]))+'</span></div>';
  }
  document.getElementById("rail").innerHTML = h;

  var c = document.getElementById("clock");
  c.hidden = (phase !== "w3");
  if(phase === "w3"){ document.getElementById("clockLabel").textContent = t("closesIn"); tick(); }
}
function tick(){
  if(phase !== "w3") return;
  var ms = DEADLINE - new Date();
  if(ms < 0){ document.getElementById("clockVal").textContent = t("closed"); return; }
  var d=Math.floor(ms/86400000), h=Math.floor(ms/3600000)%24, m=Math.floor(ms/60000)%60;
  document.getElementById("clockVal").textContent = d+"d "+h+"h "+m+"m";
}
setInterval(tick, 30000);

/* ---------------- progress ---------------- */
function drawProgress(){
  var w = document.getElementById("progWrap"), n = ITEMS.length;
  if(phase === "w3"){
    var done = 0; for(var k in myVotes) done++;
    var line = done === n ? t("progDone")
             : '<span class="big">'+esc(f("progVote",{a:done,b:n}))+'</span> '+
               '<span class="rest">'+esc(f("progLeft",{n:n-done}))+'</span>';
    w.innerHTML = '<div class="prog">'+line+
      '<div class="meter"><i style="width:'+(done/n*100)+'%"></i></div></div>';
  } else if(phase === "w1" || phase === "w2"){
    w.innerHTML = '<div class="prog"><span class="rest">'+esc(f("progItems",{b:n}))+'</span></div>';
  } else { w.innerHTML = ""; }
}

  h += '<button class="act">'+esc(t("pSend"))+'</button></div>';

  h += '<div class="zone"><div class="zlabel">'+esc(t("myProps"))+'</div>';
  for(var i=0;i<MYPROPS.length;i++){
    h += '<div style="font-size:15px;margin-bottom:6px">'+esc(MYPROPS[i].title[lang])+'</div>';
    h += '<button class="linkbtn del">'+esc(t("delete"))+'</button>';
  }
  h += '<div class="exthelp" style="margin-top:10px">'+esc(t("delNote"))+'</div>';
  h += '</div></div>';
  w.innerHTML = h;
}

/* ---------------- agenda ---------------- */
function drawAgenda(){
  var w = document.getElementById("agendaWrap");
  if(phase !== "result"){ w.innerHTML = ""; return; }
  var h = '<div class="agenda"><h2>'+esc(t("agendaH"))+'</h2>';
  h += '<div class="meta">'+esc(t("agendaWhen"))+'<br>'+esc(t("circulated"))+'</div>';
  h += '<div class="ag"><div class="agr">'+esc(t("agStanding"))+'</div></div>';
  for(var i=0;i<ITEMS.length;i++){
    var it = ITEMS[i], c = count(it);
    h += '<div class="ag"><span class="agn">'+esc(it.num)+'</span><br>'+esc(it.title[lang]);
    h += '<div class="agr">'+esc(t("onlineVote"))+': '+esc(t("agree"))+' '+c.agree+' · '+
         esc(t("disagree"))+' '+c.disagree+' · '+esc(t("abstainShort"))+' '+(c.abstain+c.no_vote);
    if(it.ext >= 3) h += ' · '+esc(t("reqExt"));
    h += '</div></div>';
  }
  w.innerHTML = h + '</div>';
}

/* ---------------- items ---------------- */
function drawItems(){
  var out = "";
  for(var i=0;i<ITEMS.length;i++) out += itemHtml(ITEMS[i], i);
  document.getElementById("items").innerHTML = out;
}
function stateLabel(it){
  if(phase==="w1"||phase==="w2") return [t("w2n"),"st-discussion"];
  if(phase==="w3") return [t("w3n"),"st-voting"];
  if(phase==="result") return it.ext>=3 ? [t("reqExt"),"st-extension"] : [t("agendaState"),"st-closed"];
  if(phase==="recording") return [t("result"),"st-closed"];
  return [t("resolution"),"st-ratified"];
}
function itemHtml(it, idx){
  var s = stateLabel(it);
  var h = '<div class="item"><div class="ihead"><span class="istate '+s[1]+'">'+esc(s[0])+'</span>';
  h += '<div class="inum">'+esc(it.num)+'</div>';
  h += '<h2 class="ititle">'+esc(it.title[lang])+'</h2></div>';
  h += '<div class="ibody">'+esc(it.body[lang])+'</div>';
  if(it.link) h += '<div class="attach">'+esc(t("attachment"))+': <a href="#">'+esc(it.link)+'</a></div>';

  if(phase==="w1")            h += zoneThread(it, false);
  else if(phase==="w2")       h += zoneThread(it, true);
  else if(phase==="w3")       h += zoneVoting(it, idx);
  else if(phase==="result")   h += zoneResult(it);
  else if(phase==="recording")h += zoneRecording(it);
  else                        h += zoneRatified(it);
  return h + '</div>';
}

/* week 1 / week 2 — comments */
function zoneThread(it, canPost){
  var h = '<div class="zone"><div class="zlabel">'+esc(t("discussion"))+'</div>';
  h += it.comments.length ? threadHtml(it) : '<div class="nocmt">'+esc(t("noCmt"))+'</div>';
  if(canPost){
    h += '<div class="fl">'+esc(t("addComment"))+'</div>';
    h += '<textarea placeholder="'+esc(t("cmtPh"))+'"></textarea>';
    h += '<button class="act">'+esc(t("post"))+'</button>';
    h += '<div class="turnout">'+esc(t("voteLater"))+'</div>';
  }
  return h + '</div>';
}

/* week 3 — sealed voting */
function zoneVoting(it, idx){
  var opts=[["agree",t("agree")],["disagree",t("disagree")],["abstain",t("abstain")]];
  var mine = myVotes[idx] || null;
  var h = '<div class="zone"><div class="zlabel">'+esc(t("yourVote"))+'</div><div class="votes">';
  for(var i=0;i<opts.length;i++){
    h += '<button class="vb" aria-pressed="'+(mine===opts[i][0]?"true":"false")+
         '" data-vote="'+opts[i][0]+'" data-idx="'+idx+'"><span class="dot"></span>'+esc(opts[i][1])+'</button>';
  }
  h += '</div><div class="fl">'+esc(t("conditions"))+'</div>';
  h += '<textarea placeholder="'+esc(t("condPh"))+'"></textarea>';
  h += '<button class="act"'+(mine?"":" disabled")+'>'+esc(mine?t("saved"):t("save"))+'</button>';

  h += '<div class="turnout">'+esc(f("turnout",{a:it.voted.length}));
  h += '<div class="names">'+esc(t("whoVoted"))+': '+esc(it.voted.join(", "))+'</div></div>';

  h += '<div class="turnout"><button class="linkbtn" data-ext="'+idx+'">'+esc(t("reqExt"))+'</button>';
  h += '<div class="exthelp">'+esc(t("extHelp"))+'</div>';
  if(extAsked[idx]) h += '<div class="exthelp">'+esc(f("extAsked",{n:1}))+'</div>';
  h += '</div>';

  h += '<div class="sub2"><div class="zlabel">'+esc(t("discussion"))+'</div>';
  h += it.comments.length ? threadHtml(it) : '<div class="nocmt">'+esc(t("noCmt"))+'</div>';
  h += '</div>';
  return h + '</div>';
}

/* after deadline — published online result */
function zoneResult(it){
  var h = '<div class="zone">';
  if(it.ext >= 3) h += '<div class="flag">'+esc(t("extFlag"))+'</div>';
  h += '<div class="zlabel">'+esc(t("result"))+'</div>' + resultsHtml(it) + '</div>';
  return h;
}

/* after the meeting, before Tum has entered the result */
function zoneRecording(it){
  return '<div class="zone"><div class="pending">'+esc(t("recording"))+'</div>'+
         '<div class="sub2"><div class="zlabel">'+esc(t("result"))+'</div>'+resultsHtml(it)+'</div></div>';
}

/* ratified */
function zoneRatified(it){
  var c = count(it);
  var h = '<div class="zone">';
  h += '<div class="res"><div class="rl">'+esc(t("resolution"))+'</div>'+esc(it.resolution[lang])+'</div>';
  h += '<div class="twocol">';
  h += '<div class="mini"><div class="ml">'+esc(t("onlineVote"))+'</div><div class="mv">'+c.agree+' / 13</div></div>';
  h += '<div class="mini"><div class="ml">'+esc(t("meetingVote"))+
       '</div><div class="mv" style="font-size:13.5px">'+esc(it.meeting[lang])+'</div></div></div>';
  h += resultsHtml(it) + '</div>';
  return h;
}

function count(it){
  var c={agree:0,disagree:0,abstain:0,no_vote:0};
  for(var i=0;i<it.tally.length;i++) c[it.tally[i].v]++;
  return c;
}
function resultsHtml(it){
  var c=count(it), n=it.tally.length, pc=function(x){return (x/n*100)+"%";};
  var h = '<div class="bar"><i style="background:var(--green);width:'+pc(c.agree)+'"></i>'+
          '<i style="background:var(--red);width:'+pc(c.disagree)+'"></i>'+
          '<i style="background:#C6CDD3;width:'+pc(c.abstain+c.no_vote)+'"></i></div>';
  h += '<div class="legend">'+
       '<span><i style="background:var(--green)"></i>'+esc(t("agree"))+' '+c.agree+'</span>'+
       '<span><i style="background:var(--red)"></i>'+esc(t("disagree"))+' '+c.disagree+'</span>'+
       '<span><i style="background:#C6CDD3"></i>'+esc(t("abstainShort"))+' '+(c.abstain+c.no_vote)+'</span></div>';
  var hit = c.agree >= 7;
  h += '<div class="thresh">'+esc(t("threshold"))+' — <b class="'+(hit?"ok":"no")+'">'+
       esc(hit?t("reached"):t("notReached"))+'</b></div>';
  h += '<table class="tally">';
  for(var i=0;i<it.tally.length;i++){
    var r=it.tally[i], lbl, cls;
    if(r.v==="agree"){lbl=t("agree");cls="pa";}
    else if(r.v==="disagree"){lbl=t("disagree");cls="pd";}
    else if(r.v==="abstain"){lbl=t("abstainShort");cls="px";}
    else {lbl=t("noVote");cls="px";}
    h += '<tr><td class="nm">'+esc(r.n)+'</td><td class="pos '+cls+'">'+esc(lbl)+'</td></tr>';
    if(r.c) h += '<tr><td colspan="2" class="cond" style="border-top:0;padding-top:0">'+esc(r.c[lang])+'</td></tr>';
  }
  return h + '</table>';
}
function threadHtml(it){
  var h="";
  for(var i=0;i<it.comments.length;i++){
    var c=it.comments[i];
    h += '<div class="cmt"><div class="by">'+esc(c.by)+'<span class="when">'+esc(c.when[lang])+
         '</span></div><div class="txt">'+esc(c.txt[lang])+'</div></div>';
  }
  return h;
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("button") : null;
  if(!b) return;
  if(b.dataset.lang){
    lang = b.dataset.lang;
    document.body.setAttribute("data-lang", lang);
    document.documentElement.lang = (lang==="jp"?"ja":lang);
    var bs=document.querySelectorAll(".lang button");
    for(var i=0;i<bs.length;i++) bs[i].setAttribute("aria-pressed", bs[i].dataset.lang===lang?"true":"false");
    render();
  }
  if(b.dataset.vote){ myVotes[b.dataset.idx] = b.dataset.vote; render(); }
  if(b.dataset.ext){ extAsked[b.dataset.ext] = true; render(); }
});
document.getElementById("phasePick").addEventListener("change", function(e){
  phase = e.target.value; render();
});

function render(){ drawPhase(); drawProgress(); drawAgenda(); drawSubmit(); drawItems(); }
render();
</script>
</body>
</html>
